encryption:
  transport: tls
  request_signing: none_observed
  request_encryption: none_observed
  response_encryption: none_observed
  storage_encryption: none_observed
  certificate_pinning: unknown
  notes: "登录/签到/福币/商品接口走普通 JSON + Sf-Authorization: sid + cusId，未发现签名。utils/sf-req2.js 另有会员卡/云支付 MD5 签名链路，首期不需要；硬编码 key 不记录。"

auth:
  login_endpoint: "/ms-sanfu-wechat-customer-core/customer/core/wxMiniAppLogin"
  method: POST
  code_field: code
  session_field: sid
  session_type: header_and_body
  session_expiry: "48h local cache; server may expire earlier"
  refresh: re-login-code
  phone_binding: "unknown / required for register"
  notes: "成功 data 还含 curCusId、openid、sessionKey、unionid、qwShoId；后续 header Sf-Authorization: sid、cusId: curCusId；失败 code=40301 表示未登录。"

points:
  currency: fubi
  balance_endpoint: "/ms-sanfu-wechat-customer/customer/getPoint"
  history_endpoint: ""
  rules_endpoint: "H5 user/fubi-rule; signRule"
  expiry_policy: year_end
  expiry_verified: true
  notes: "getPoint 返回 restMoney（余额）、historyPoint（即将过期数量）、nextYear（有效期截止）；UI 文案“有效期截止至 {nextYear}24时”，年末过期。"

products:
  list_endpoint: "/ms-sanfu-wechat-coupon/coupon/listPointExchangeCoupon; /ms-sanfu-wechat-coupon/coupon/listPointExchangeCouponNew"
  detail_endpoint: "/ms-sanfu-wechat-coupon/coupon/getPointExchangeCoupon"
  redeem_endpoint: "/ms-sanfu-wechat-coupon/coupon/usePointExchangeCoupon"
  notes: "外部权益：listExternalExchangeIndex/listExternalExchange/usePointExchange；字段 giftId/giftPrice/statusId/hourList 等；库存/限购字段待实测。"

activities:
  list_endpoint: "badge/listBadge, badge/listCustomerBadge, automation/getCombinationAutomationCfg, gift/getGift, donate/listDonateConfig, game/listGameForPop"
  claim_endpoint: "badge/activateBadge, badge/receiveBadgeReward, automation/saveMarketingAutomationReceive, gift/receiveGift"
  notes: "福币任务入口：签到、购买商品、点亮勋章、评价订单；先只读，确认幂等后再领取。"

scripts:
  planned:
    - login
    - sign_in
    - points
    - products
    - redeem
    - activities
    - register
  common:
    - auth
    - http
    - crypto
  notes: "一功能一脚本；auth 封装 ensureSession/login，sign_in/points/products/redeem 等导入。"

