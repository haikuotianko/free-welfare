# YYB 共用网络：docker network create qinglong_default
# YYB 部署文档：https://github.com/525815266/YYB-Go-Enhanced
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-welfare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-welfare}
      POSTGRES_DB: ${POSTGRES_DB:-welfare}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 只绑定本机，方便宿主机跑 prisma migrate/studio；不需要可删
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-welfare} -d ${POSTGRES_DB:-welfare}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ${FW_IMAGE:-ghcr.io/haikuotianko/free-welfare:latest}
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    command: sh -c "node --import ./tools/ensure-secrets.mjs tools/migrate.mjs && node --import ./tools/ensure-secrets.mjs apps/api/dist/main.js"
    ports:
      - '${API_HOST_PORT:-31888}:3000'
    volumes:
      - ../../data:/data
    networks:
      - default
      - qinglong_default
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(\"http://127.0.0.1:3000/api/v1/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    image: ${FW_IMAGE:-ghcr.io/haikuotianko/free-welfare:latest}
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    command: node --import ./tools/ensure-secrets.mjs apps/worker/dist/main.js
    volumes:
      - ../../data:/data
    networks:
      - default
      - qinglong_default
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '${CADDY_HTTP_PORT:-80}:80'
      - '${CADDY_HTTPS_PORT:-443}:443'
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  # YYB-Go-Enhanced 建议单独部署，并通过 qinglong_default 外部网络连接：
  # https://github.com/525815266/YYB-Go-Enhanced
  # Free Welfare 的 api/worker 已加入该网络；YYB 侧把 YYB_DOCKER_NETWORK 设为同一个网络名。

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  qinglong_default:
    external: true
    name: ${YYB_DOCKER_NETWORK:-qinglong_default}
